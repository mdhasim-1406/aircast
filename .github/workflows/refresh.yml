name: Daily forecast and monitoring
on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore forecast ledger
        uses: actions/cache/restore@v4
        with:
          path: data/platform-ledger.json
          key: aircast-ledger-${{ github.run_id }}
          restore-keys: aircast-ledger-
      - run: PYTHONPATH=src:. python scripts/daily.py
      - name: Save forecast ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/platform-ledger.json
          key: aircast-ledger-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-monitoring
          path: |
            data/platform-ledger.json
            artifacts/platform/monitoring.json
